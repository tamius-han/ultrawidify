<div class="uw-aard-debug-window_handle" style="cursor: move; background: #222; color: #fff; padding: 0.5rem 1rem; font-size: 16px; user-select: none;">Debug results</div>
<div style="display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; flex-direction: row; gap: 1rem; padding: 0.5rem; width: 960px">
    <div style="display: flex; flex-direction: column; gap: 1rem; padding: 0.5rem;">
      <div id="uw-aard-debug_aard-status_no-letterbox"        class="indicator off">Full frame</div>
      <div id="uw-aard-debug_aard-status_double-letterbox"    class="indicator off uncertain">Double letterbox</div>
      <div id="uw-aard-debug_aard-status_ar-stable"           class="indicator off">AR stable</div>
      <div id="uw-aard-debug_aard-status_ar-delta-stable"     class="indicator off marginal">AR delta-stable</div>
      <div id="uw-aard-debug_aard-status_ar-unstable"         class="indicator off uncertain">AR unstable</div>
      <div id="uw-aard-debug_aard-status_crop-invalidated"    class="indicator off problem">Uncertain invalidated!</div>
      <div id="uw-aard-debug_aard-status_crop-maintaining"    class="indicator off uncertain">Uncertain maintaining</div>
      <div id="uw-aard-debug_aard-status_subtitles_none"      class="indicator off">No subtitles</div>
      <div id="uw-aard-debug_aard-status_subtitles_uncertain" class="indicator off uncertain">Subs uncertain</div>
      <div id="uw-aard-debug_aard-status_subtitles_confirmed" class="indicator off problem">Subs confirmed</div>
    </div>
    <div id="uw-aard-debug_aard-status_chart" style="flex-grow: 1; position: relative; min-width: 0;">
      <canvas style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000;"></canvas>
    </div>
  </div>
</div>
<pre id="uw-aard-results" style="padding: 1rem; margin: 0;"></pre>
<div id="uw-aard-subtitle-verification" style="display: flex; flex-direction: row; gap: 2rem; width: 100%">
  <div style="flex: 1 1 auto;">
    <b>Top:</b><span id="uw-aard-subtitle-verification-top-status"></span>
    <div id="uw-aard-subtitle-verification-top-table" class="buffer-table" style="width: 100%"></div>
  </div>
  <div style="flex: 1 1 auto;">
    <b>Bottom:</b><span id="uw-aard-subtitle-verification-bottom-status"></span>
    <div id="uw-aard-subtitle-verification-bottom-table" class="buffer-table" style="width: 100%"></div>
  </div>
</div>
